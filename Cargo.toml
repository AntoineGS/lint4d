[workspace]
members = [
    "crates/pascal-core",
    "crates/lint4d",
    "crates/fmt4d",
    "crates/pascal-lsp",
    "crates/pascal-project",
    "crates/pascal-cache",
    "crates/tree-sitter-pascal",
    "crates/cfg-core",
    "crates/cfg-pascal",
]
resolver = "2"

# ---- Release profile (review BP-H7 / CI-H2) ------------------------
# Without this, release binaries don't use LTO or stripping and are
# ~40% larger and ~15% slower than necessary.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

# File:line backtraces without full debuginfo: much smaller binaries and
# faster links. Set `debug = true` locally if you need a debugger.
[profile.dev]
debug = "line-tables-only"

# l4d-71 measured three rotating rounds with Rust 1.99 on Linux.
# One clean build, one real edit rebuild, and one full pascal-lsp suite:
# selective median 256.385s vs current 277.483s (~7.6% lower).
# Component medians: clean 53.972s vs 76.910s; edit 2.869s vs 2.869s; suite 199.721s vs 197.175s.
# The suite was slower under selective; this is only the defined workload mix,
# not a universal runtime or workstation speed claim.
[profile.dev.package.tree-sitter]
opt-level = 3
[profile.dev.package.tree-sitter-pascal]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.globset]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

# ---- Shared package metadata (review BP-H8) ------------------------
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/AntoineGS/lint4d"
homepage = "https://github.com/AntoineGS/lint4d"
authors = ["Antoine Gaudreau Simard"]
# Internal crates; never published to crates.io.
publish = false


# ---- Workspace lints (review BP-H3, BP-H4) -------------------------
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
# pedantic is temporarily set to allow pending Phase F cleanup; the full
# subset of allows below will become active when pedantic is re-enabled.
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Restriction lints — currently allow because CI uses `-D warnings`, so
# warn would block the pipeline. Re-tighten to "warn" once test code is
# annotated with local allows in Phase F.
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
unimplemented = "allow"
# Hard-deny: dbg! must never land in committed code.
dbg_macro = "deny"
