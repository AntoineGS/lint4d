[package]
name = "lint4d"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An open-source Delphi linter powered by tree-sitter"

[dependencies]
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.24"
tree-sitter-pascal = "0.10"
tree-sitter-language = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
globset = "0.4"
walkdir = "2"
quick-xml = "0.37"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
