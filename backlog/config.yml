project_name: "lint4d"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Deferred", "Done"]
labels: ["arch-review", "lsp", "core", "lint", "fmt", "grammar", "build", "runtime", "maintenance", "correctness", "build-time", "cross-repo", "agent-todos", "workspace-perf", "rtl-units"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "nvim"
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
