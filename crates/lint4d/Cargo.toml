[package]
name = "lint4d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "An open-source Delphi linter powered by tree-sitter"

[dependencies]
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.24"
tree-sitter-pascal = { path = "../../../tree-sitter-pascal" }
tree-sitter-language = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
cfg-pascal = { git = "https://github.com/AntoineGS/cfg-pascal.git", rev = "208d6743c61e0b391195958270a5e04e3a4328d4" }
# cfg-core is intentionally not a direct dependency: lint4d uses the
# cfg-pascal public re-export for all cfg-core types, preserving one crate
# identity. Cargo.lock pins the transitive git revision.
petgraph = "0.7"
owo-colors = { version = "4", features = ["supports-colors"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
globset = "0.4"
walkdir = "2"
quick-xml = "0.37"
tempfile = "3"
pascal-core = { path = "../pascal-core" }
pascal-project = { path = "../pascal-project" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"

[dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[[bench]]
name = "lint_bench"
harness = false

[lints]
workspace = true
