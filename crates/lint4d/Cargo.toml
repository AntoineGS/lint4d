[package]
name = "lint4d"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "An open-source Delphi linter powered by tree-sitter"

[dependencies]
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.24"
tree-sitter-pascal = { git = "https://github.com/AntoineGS/tree-sitter-pascal.git" }
tree-sitter-language = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
cfg-core = { git = "https://github.com/AntoineGS/cfg-core.git" }
cfg-pascal = { git = "https://github.com/AntoineGS/cfg-pascal.git" }
petgraph = "0.7"
owo-colors = { version = "4", features = ["supports-colors"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
globset = "0.4"
walkdir = "2"
quick-xml = "0.37"
tempfile = "3"
pascal-core = { path = "../pascal-core" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"

[dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[[bench]]
name = "lint_bench"
harness = false

[lints.rust]
warnings = "deny"
