[package]
name = "pascal-core"
version = "0.1.0"
edition = "2021"
description = "Shared parsing and discovery infrastructure for Delphi/Object Pascal tools"

[dependencies]
tree-sitter = "0.24"
tree-sitter-pascal = { path = "../../../tree-sitter-pascal" }
tree-sitter-language = "0.1"
serde = { version = "1", features = ["derive"] }
globset = "0.4"
walkdir = "2"
quick-xml = "0.37"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

[lints.rust]
warnings = "deny"
