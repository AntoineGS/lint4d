[references]
record_fields = "Reference-derived, not a local compiler run: https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Record Types gives field-type alignment, final round-up to the largest field alignment, and packed/A- consecutive storage. https://docwiki.embarcadero.com/RADStudio/Florence/en/Align_fields_(Delphi) explicitly controls maximum alignment by A1/A2/A4/A8. Win64 uses Delphi/MSVC compatibility http://rvelthuis.de/articles/articles-convert.html Getting alignment right plus https://learn.microsoft.com/en-us/cpp/build/x64-software-conventions?view=msvc-170 aggregate padding, not extrapolation of the Win32-only table. Byte at0 plus LongWord aligned to4 starts4, ends8; packed equivalent ends5/alignment1. Grouped X,Y:Byte each contributes1, Z contributes4, total6/alignment1. OLDTYPELAYOUT OFF is explicit, not a guessed compiler37 default. Unknown/ON legacy packing of non-byte grouped fields remains unsupported (no verified final-alignment rule)."
record_stride = "record_fields establishes R=LongWord+Byte offsets0,4, end5 rounded to8/alignment4. Three R elements occupy24. Nested N=Byte+R uses R at4, ends12/alignment4; two N elements occupy24. https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Static Array Types contiguous-element size multiplication uses complete padded element storage; no host sizeof/alignof."
record_variants = "https://www.delphibasics.co.uk/Article.php?Name=Records states variant sections overlay the same area at the record end and a named selector defines a variable. https://docwiki.embarcadero.com/RADStudio/Athens/en/Structured_Types_(Delphi) Variant Parts in Records specifies optional named tag fields and nested variants; field/final alignment follows record_fields, with union alignment/max-member-size corroborated through the Delphi/MSVC Windows chain in record_fields. Packed named Byte tag + max(Word2,Int648)=9; unnamed has no tag storage, size8. Nested packed B1 + max(A2+T1+max(C1,D8),E4)=12. Ordinary B1+Tag1 requires common variant start8 for Int64, union8, end16/alignment8. All are derivations, not Delphi/Wine measurements."
layout_options = "https://docwiki.embarcadero.com/RADStudio/Florence/en/Align_fields_(Delphi) A/ALIGN local maximum-field-alignment states; A16 intentionally unverified in this profile. https://docwiki.embarcadero.com/RADStudio/Athens/en/Minimum_enumeration_size_(Delphi) Z1/Z2/Z4; https://docwiki.embarcadero.com/RADStudio/Athens/en/Long_strings_(Delphi) H/LONGSTRINGS; https://docwiki.embarcadero.com/RADStudio/Athens/en/Real_compatibility_(Delphi) REALCOMPATIBILITY. https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) OLDTYPELAYOUT applies only grouped fields; only OFF yields modeled ordinary grouped alignment. https://blogs.embarcadero.com/rad-studio-13-every-new-and-enhanced-feature identifies PUSHOPT/POPOPT as new in13/CompilerVersion37. https://docwiki.embarcadero.com/RADStudio/Florence/en/Option_OPT_(Delphi) describes whole-option save/restore and the eligible list containing ALIGN, MINENUMSIZE, LONGSTRINGS/H, OLDTYPELAYOUT and REALCOMPATIBILITY. Controller-retrieved official indexed excerpts in task-5-evidence.md correct the earlier erroneous LONGSTRINGS exclusion. Only no-argument PUSHOPT/POPOPT on37 Windows are supported; subset forms, earlier versions, unknown/unmatched/malformed restores cannot restore defaults or expose older proven snapshots."
variant_eligibility = "https://docwiki.embarcadero.com/RADStudio/Sydney/en/Structured_Types_(Delphi) Variant Parts in Records: variant alternatives prohibit long strings, dynamic arrays, Variant, interfaces and structured types containing them; pointers to those are allowed. Official indexed excerpt retained by controller in task-5-evidence.md. Eligibility follows definition-site aliases/structured content independently of stride: H- String is short/unmanaged, H+ is long/forbidden, unknown H cannot prove eligibility. A named ordinal tag is an extra non-variant field. No new class/reference ABI or proprietary compiler result is inferred."
static_arrays = "https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Static Array Types: contiguous elements, lowest index at lowest address, total size equals element size times element count. https://docwiki.embarcadero.com/RADStudio/Athens/en/Structured_Types_(Delphi) array index types are ordinal domains; multidimensional arrays are arrays of arrays. Thus [-2..2,1..3] has5*3 elements, Boolean has2 values and [-3..1] has5. Word size2 and inherent alignment2 follow ordinal32/ordinal64. Array alignment follows element alignment through Delphi/MSVC compatibility http://rvelthuis.de/articles/articles-convert.html and https://learn.microsoft.com/en-us/cpp/build/x64-software-conventions?view=msvc-170 . No record stride is inferred here."
ordinal_arrays = "https://docwiki.embarcadero.com/RADStudio/Athens/en/Simple_Types_(Delphi) enumerated types and subrange types establish ordered ordinal values; (Red,Green,Blue) has values0..2. https://docwiki.embarcadero.com/RADStudio/Athens/en/Minimum_enumeration_size_(Delphi) explicitly selected Z4 affects enumeration storage, not its ordinal domain. Internal Data Formats ordinal storage plus ordinal64 establishes size4/alignment4 for explicit Z4; array[E] of Byte has3 elements of size1/alignment1 regardless of Z4. No compiler37 default switch is inferred."
native_old = "https://docs.devart.com/odac/work-rad-studio-xe2.htm records Delphi2007 NativeInt size8 and2009 size4. https://delphidabbler.com/notes/version-features footnote4 confirms NativeInt/NativeUInt signed/unsigned64 before2009; UInt64 introduced Delphi7. Delphi Win32 ordinal64 inherent alignment8 follows https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) and Delphi6+ MSVC alignment compatibility http://rvelthuis.de/articles/articles-convert.html . Not assumed pointer-sized on18.5."
ordinal32 = "Delphi ordinal/character/boolean widths and Windows native/LongInt/LongWord mapping: https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) and https://docwiki.embarcadero.com/RADStudio/Athens/en/64-bit_Windows_Data_Types_Compared_to_32-bit_Windows_Data_Types . Internal Data Formats Record Types explicitly supplies Win32 ordinal inherent alignment (1/2/4/8); boolean aliases map to Byte/Word/LongInt. No use of host types."
ordinal64 = "Same Delphi storage mappings as ordinal32; signed/unsigned 8/16/32/64-bit ordinals map to INT8/UINT8/INT16/UINT16/INT32/UINT32/INT64/UINT64. Delphi-specific Win32/Win64 MSVC alignment compatibility: http://rvelthuis.de/articles/articles-convert.html Getting alignment right. Required scalar-member alignments: https://learn.microsoft.com/en-us/cpp/build/x64-software-conventions?view=msvc-170 x64 aggregate and union layout. This chain, NOT the Win32-only alignment table, establishes Win64 1/2/4/8."
real32 = "https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Real Types and Win32 Record Types alignment table explicitly state Real48 storage6/alignment2, Single4/alignment4 and Double8/alignment8."
real64 = "Delphi Single/Double IEEE FP32/FP64 storage: https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Real Types. Win64 Delphi/MSVC compatibility: http://rvelthuis.de/articles/articles-convert.html Getting alignment right. FP32=4/FP64=8 required member alignment: https://learn.microsoft.com/en-us/cpp/build/x64-software-conventions?view=msvc-170 . Secondary Delphi Double offset8 example: https://schellingerhout.github.io/data%20transmission/datatransmission1/ Record Alignment and Padding."
currency = "Delphi Currency is stored as an 8-byte scaled signed64 integer: https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Currency Type. Alignment8 follows signed64 storage mapping and http://rvelthuis.de/articles/articles-convert.html Delphi/MSVC compatibility, with https://learn.microsoft.com/en-us/cpp/build/x64-software-conventions?view=msvc-170 INT64 alignment8 for Win64; Delphi Win32 ordinal alignment8 for this integer representation."
pointer32 = "Delphi pointer, long-string, WideString and dynamic-array variables store a 32-bit address, not payload/header: https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Pointer/Long String/Wide String/Dynamic Array Types. Delphi-specific Win32/Win64 MSVC alignment compatibility: http://rvelthuis.de/articles/articles-convert.html Getting alignment right. Explicit Microsoft C/C++ pointer natural-alignment rule: https://learn.microsoft.com/en-us/windows/win32/midl/c-compiler-packing-issues Natural Alignment states a pointer starts at an address modulo its size, pointers are4bytes in32-bit environments, and default alignment equals natural alignment; Packing versus Alignment distinguishes smaller effective packing from inherent alignment. This mapped chain establishes Win32 pointer alignment4 independently of Delphi A defaults. The _SECURITY_DESCRIPTOR offset4 example is NOT alignment proof: preceding fields already occupy4bytes, so that offset does not discriminate alignment1/2/4."
pointer64 = "Delphi pointer/AnsiString/UnicodeString/WideString/dynamic-array storage is an 8-byte pointer: https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Pointer/Long String/Wide String/Dynamic Array Types. Delphi-specific Win64 MSVC compatibility http://rvelthuis.de/articles/articles-convert.html Getting alignment right plus POINTER required member alignment8 https://learn.microsoft.com/en-us/cpp/build/x64-software-conventions?view=msvc-170 ."
extended32 = "https://docwiki.embarcadero.com/Libraries/Florence/en/System.Extended explicitly establishes Win32 size10; https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Win32 alignment table explicitly establishes Extended alignment8, NOT alignment10."
extended64 = "https://docwiki.embarcadero.com/Libraries/Florence/en/System.Extended explicitly makes Win64 Extended an alias of Double (size8). Double FP64 storage, Delphi/MSVC alignment compatibility http://rvelthuis.de/articles/articles-convert.html and required FP64 member alignment8 https://learn.microsoft.com/en-us/cpp/build/x64-software-conventions?view=msvc-170 complete the chain. Rudy's later Extended size table omits Win64; NOT used."
char = "https://docwiki.embarcadero.com/RADStudio/Florence/en/Unicode_in_RAD_Studio : Delphi2009 introduced Unicode Char (WideChar), earlier Char=AnsiChar. Compiler versions: https://docwiki.embarcadero.com/RADStudio/Florence/en/Compiler_Versions . Character storage and ordinal alignment chain ordinal32/ordinal64 applies after version selection."
short = "https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) Short String Types: maximum length255+length byte, array of unsigned byte storage. Win32 short string alignment1 explicit table; Win64 unsigned-byte element alignment1 and array element alignment via Delphi/MSVC compatibility http://rvelthuis.de/articles/articles-convert.html and https://learn.microsoft.com/en-us/cpp/build/x64-software-conventions?view=msvc-170 . No 256-byte alignment inference."
string = "https://docwiki.embarcadero.com/RADStudio/Athens/en/Long_strings_(Delphi) H+/H- representation and H+ Athens default; https://docwiki.embarcadero.com/RADStudio/Florence/en/Unicode_in_RAD_Studio pre2009 AnsiString/post2009 UnicodeString. Storage/alignment follows pointer32/pointer64 or short chain. Florence defaults remain unknown without explicit H."
real = "https://docwiki.embarcadero.com/RADStudio/Alexandria/en/Real48_compatibility_(Delphi) explicitly maps REALCOMPATIBILITY ON Real=Real48/OFF Real=Double. Follow real32/real64 only when selected representation has verified alignment; do not infer the switch default."
real48_unverified = "https://docwiki.embarcadero.com/RADStudio/Athens/en/Internal_Data_Formats_(Delphi) establishes size6 for Real48 but its alignment table is expressly32-bit-only. No verified Win64 equivalent exists in the MSVC scalar chain. expected_alignment omitted means UnsupportedLayout, NOT a known size-only StorageLayout."
