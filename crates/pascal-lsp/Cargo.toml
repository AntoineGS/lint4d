[package]
name = "pascal-lsp"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Navigation library for a native Linux Delphi/Object Pascal LSP"

[features]
# Opt-in only: this builds the deterministic child-process harness used by the
# `protocol_barriers` integration target. It is intentionally not a default
# feature and must never be enabled for the production `pascal-lsp` binary.
test-support = []

[[bin]]
name = "pascal-lsp-test-server"
path = "src/test_server.rs"
required-features = ["test-support"]
test = false

[[test]]
name = "protocol_barriers"
path = "tests/protocol_barriers.rs"
required-features = ["test-support"]

[dependencies]
pascal-core = { path = "../pascal-core" }
pascal-project = { path = "../pascal-project" }
lint4d = { path = "../lint4d" }
fmt4d = { path = "../fmt4d" }
tree-sitter = "0.24"
lsp-types = "=0.95.1"
lsp-server = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
globset = "0.4"
crossbeam-channel = "0.5"

[dev-dependencies]
pascal-project = { path = "../pascal-project", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
